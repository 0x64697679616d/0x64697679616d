<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-label="0x64697679616d. Signal in the noise. Always listening." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/>
  </pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3fa9a0" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#3fa9a0" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#3fa9a0" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>
</defs>
<style>
  text{font-family:'Courier New',monospace}
  .fade{opacity:0;animation:fadein 2.4s ease-out forwards}
  .d2{animation-delay:.8s}
  .d3{animation-delay:1.6s}
  .scan{animation:sweep 6s linear infinite}
  .gA{animation:glitchA 7s steps(1,end) infinite}
  .gB{animation:glitchB 7s steps(1,end) infinite}
  .cur{animation:blink 1.4s steps(2,start) infinite}
  @keyframes fadein{to{opacity:1}}
  @keyframes sweep{0%{transform:translateY(-70px)}100%{transform:translateY(240px)}}
  @keyframes glitchA{0%,91%,95%,100%{transform:translate(0,0);opacity:0}92%{transform:translate(-4px,1px);opacity:.7}93%{transform:translate(3px,-1px);opacity:.5}94%{transform:translate(-2px,0);opacity:.6}}
  @keyframes glitchB{0%,91%,95%,100%{transform:translate(0,0);opacity:0}92%{transform:translate(4px,-1px);opacity:.5}93%{transform:translate(-3px,1px);opacity:.6}94%{transform:translate(2px,0);opacity:.4}}
  @keyframes blink{to{visibility:hidden}}
</style>

<rect width="860" height="220" fill="#050505"/>
<rect width="860" height="220" fill="url(#lines)"/>
<rect class="scan" x="0" y="0" width="860" height="70" fill="url(#scan)"/>

<g class="fade">
  <text x="430" y="112" font-size="46" letter-spacing="8" text-anchor="middle" fill="#3fa9a0" class="gA">0x64697679616d</text>
  <text x="430" y="112" font-size="46" letter-spacing="8" text-anchor="middle" fill="#7a2f2f" class="gB">0x64697679616d</text>
  <text x="430" y="112" font-size="46" letter-spacing="8" text-anchor="middle" fill="#d3dcdc">0x64697679616d</text>
</g>
<text class="fade d2" x="430" y="148" font-size="14" letter-spacing="7" text-anchor="middle" fill="#3fa9a0">SIGNAL IN THE NOISE<tspan class="cur" fill="#3fa9a0">_</tspan></text>
<text class="fade d3" x="430" y="176" font-size="11" letter-spacing="4" text-anchor="middle" fill="#5d6b6b">ALWAYS LISTENING</text>

<rect width="860" height="220" fill="url(#vig)"/>
<rect x="0.5" y="0.5" width="859" height="219" fill="none" stroke="#1c2425"/>
</svg>
