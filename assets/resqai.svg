<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="ResQ AI pipeline: extract, cluster, rank, visualize, summarize" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs><style>text{font-family:'Courier New',monospace}.nd{animation:np 3.5s ease-in-out infinite}.fl{animation:dash 1s linear infinite}.pk{animation:pk 3.5s linear infinite;opacity:0}.rp{transform-box:fill-box;transform-origin:center;animation:ping ease-out infinite}.cur{animation:blink 1.2s steps(2,start) infinite}@keyframes np{0%{stroke-opacity:.35}10%{stroke-opacity:1}30%,100%{stroke-opacity:.35}}@keyframes dash{to{stroke-dashoffset:-8}}@keyframes pk{0%{opacity:0;transform:translateX(0)}3%{opacity:1}12%{opacity:1;transform:translateX(40px)}15%,100%{opacity:0;transform:translateX(40px)}}@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(5);opacity:0}}@keyframes blink{to{visibility:hidden}}</style><rect x=".5" y=".5" width="859" height="299" rx="10" fill="#080808" stroke="#1c2425"/><text x="30" y="36" font-size="14" fill="#3fa9a0">// resq_ai : pipeline<tspan class="cur">_</tspan></text><rect class="nd" x="30" y="58" width="128" height="46" rx="8" fill="#0d1213" stroke="#3fa9a0" stroke-width="1.3" style="animation-delay:0.0s"/><text x="94.0" y="86" font-size="14" fill="#d3dcdc" text-anchor="middle">Extract</text><text x="94.0" y="124" font-size="11" fill="#5d6b6b" text-anchor="middle">type, place, severity</text><line class="fl" x1="158" y1="81" x2="198" y2="81" stroke="#3fa9a0" stroke-opacity=".6" stroke-dasharray="4 4"/><circle class="pk" cx="158" cy="81" r="3.5" fill="#3fa9a0" style="animation-delay:0.35s"/><rect class="nd" x="198" y="58" width="128" height="46" rx="8" fill="#0d1213" stroke="#3fa9a0" stroke-width="1.3" style="animation-delay:0.7s"/><text x="262.0" y="86" font-size="14" fill="#d3dcdc" text-anchor="middle">Cluster</text><text x="262.0" y="124" font-size="11" fill=